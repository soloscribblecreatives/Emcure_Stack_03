<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="cache-control" content="max-age=200" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="chrome=1" />
    <title>Tavin AF</title>
    <link rel="stylesheet" type="text/css" href="global.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="animate.css" media="screen" />
	
    <script src="jquery.min.js" type="text/javascript" language="javascript"></script>
    <script src="jquery.mobile.custom.min.js" type="text/javascript" language="javascript"></script>
    <script src="jquery.touchSwipe.min.js" type="text/javascript" language="javascript"></script>
  </head>

  <body>
    <!-- Main fixed-size presentation canvas -->
    <div id="wrapper" rel="1">
      <!-- Previous/next slide navigation controls -->
      <div class="slide_arrow">
        <div class="left_arrow"><img src="left_arrow.png" alt="previous icon" width="30" height="30"/></div>
        <div class="right_arrow"><img src="right_arrow.png" alt="next icon" width="30" height="30" /></div>
      </div>
      <div id="main_content">
        <div id="zoom_container"></div>
      </div>
      <!-- Slide thumbnail drawer and integration placeholders -->
      <div class="reference active">
        <div class="box">
          <div class="slide_jumper">
            <div class="slides"><img src="thumbs/01.png"/></div>
            <div class="slides"><img src="thumbs/02.png"/></div>
            <div class="slides"><img src="thumbs/03.png"/></div>
          </div>
        </div>
        <div class="box_btn"></div>
        <div id="myconsole"></div>
        <div id="click_through"></div>
      </div>
    </div>
	
    <script src="global.js" type="text/javascript" language="javascript"></script><script>
      function resizeWrapper() {
        var baseWidth = 1080;
        var baseHeight = 810;
        var scale = Math.min(
          window.innerWidth / baseWidth,
          window.innerHeight / baseHeight,
        );

        var scaledWidth = baseWidth * scale;
        var scaledHeight = baseHeight * scale;

        var wrapper = document.getElementById("wrapper");
        wrapper.style.transform = "scale(" + scale + ")";
        wrapper.style.left = (window.innerWidth - scaledWidth) / 2 + "px";
        wrapper.style.top = (window.innerHeight - scaledHeight) / 2 + "px";
      }

      window.addEventListener("resize", resizeWrapper);
      window.addEventListener("orientationchange", resizeWrapper);
      document.addEventListener("DOMContentLoaded", resizeWrapper);
      // Also run immediately in case DOMContentLoaded already fired by the time this executes
      resizeWrapper();

      // Load the first slide markup when the document is ready.
      $(document).ready(function () {
        var selectedContentPath = "slide1/";
        $("#zoom_container").html(
          '<link rel="stylesheet" type="text/css" href="slide1/slide1.css" media="screen"/><div class="s1"><img src="slide1/s1.png"></div><div class="s2"><img src="slide1/s2.png"></div><video preload="auto" class="s3" id="s3" width="1080" height="810"><source src="slide1/s1.mp4" type="video/mp4"></video><div class="tapIt" onclick="tapIt()"></div>',
        );
      });
    </script>
  </body>
</html>
