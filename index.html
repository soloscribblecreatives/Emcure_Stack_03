<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="cache-control" content="max-age=200" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="X-UA-Compatible" content="chrome=1" />
    <title>Nucron</title>
    <link rel="stylesheet" type="text/css" href="global.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="animate.css" media="screen" />
	
    <script src="jquery.min.js" type="text/javascript" language="javascript"></script>
    <script src="jquery.mobile.custom.min.js" type="text/javascript" language="javascript"></script>
    <script src="jquery.touchSwipe.min.js" type="text/javascript" language="javascript"></script>
  </head>

  <body>
    <!-- Main fixed-size presentation canvas -->
    <div id="wrapper" rel="1">
      <!-- Previous/next slide navigation controls -->
      <div class="slide_arrow">
        <div class="left_arrow"><img src="left_arrow.png" alt="previous icon" width="30" height="30"/></div>
        <div class="right_arrow"><img src="right_arrow.png" alt="next icon" width="30" height="30" /></div>
      </div>
      <div id="main_content">
        <div id="zoom_container"></div>
      </div>
      <!-- Slide thumbnail drawer and integration placeholders -->
      <div class="reference active">
        <div class="box">
          <div class="slide_jumper">
            <div class="slides"><img src="thumbs/01.png"/></div>
          </div>
        </div>
        <div class="box_btn"></div>
        <div id="myconsole"></div>
        <div id="click_through"></div>
      </div>
    </div>
	
    <script src="global.js" type="text/javascript" language="javascript"></script><script>
      function resizeWrapper() {
        var baseWidth = 1080;
        var baseHeight = 810;
        var scale = Math.min(
          window.innerWidth / baseWidth,
          window.innerHeight / baseHeight,
        );

        var scaledWidth = baseWidth * scale;
        var scaledHeight = baseHeight * scale;

        var wrapper = document.getElementById("wrapper");
        wrapper.style.transform = "scale(" + scale + ")";
        wrapper.style.left = (window.innerWidth - scaledWidth) / 2 + "px";
        wrapper.style.top = (window.innerHeight - scaledHeight) / 2 + "px";
      }

      window.addEventListener("resize", resizeWrapper);
      window.addEventListener("orientationchange", resizeWrapper);
      document.addEventListener("DOMContentLoaded", resizeWrapper);
      // Also run immediately in case DOMContentLoaded already fired by the time this executes
      resizeWrapper();

      // Load the first slide markup when the document is ready.
      $(document).ready(function () {
        var selectedContentPath = "slide1/";
        $("#zoom_container").html(
          '<link rel="stylesheet" type="text/css" href="slide1/slide1.css" media="screen"/><div class="video0"><video preload="auto" autoplay poster="slide1/Poster.png" onplay="onPlay0()" onended="onEnded0()" id="video0" width="1080" height="810"><source src="slide1/Part0.mp4" type="video/mp4"></video></div><div class="video1"><video preload="auto" loop onplay="onPlay1()" onended="onEnded1()" id="video1" width="1080" height="810"><source src="slide1/Part1.mp4" type="video/mp4"></video></div><div class="flash1"><img src="slide1/flash1.png"></div><div class="video2"><video preload="auto" onplay="onPlay2()" onended="onEnded2()" id="video2" width="1080" height="810"><source src="slide1/Part2.mp4" type="video/mp4"></video></div><div class="flash2"><img src="slide1/flash2.png"></div><div class="video3"><video preload="auto" onended="onEnded3()" id="video3" width="1080" height="810"><source src="slide1/Part3.mp4" type="video/mp4"></video></div><div class="video4"><video preload="auto" onended="onEnded4()" id="video4" width="1080" height="810"><source src="slide1/Part4.mp4" type="video/mp4"></video></div><div class="button1" onclick="playVid1()"></div><div class="button2" onclick="playVid2()"></div><div class="button3" onclick="playVid3()"></div><div class="pat1"><img src="slide1/pat1.png"></div><div class="pat2"><img src="slide1/pat2.png"></div><div class="pat3"><img src="slide1/pat3.png"></div><div class="pat4"><img src="slide1/pat4.png"></div><div class="pat5"><img src="slide1/pat5.png"></div><div class="pat6"><img src="slide1/pat6.png"></div><div class="pat7"><img src="slide1/pat7.png"></div><div class="pat8"><img src="slide1/pat8.png"></div><div class="pat9"><img src="slide1/pat9.png"></div><div class="pat10"><img src="slide1/pat10.png"></div><div class="pat11"><img src="slide1/pat11.png"></div><div class="pat12"><img src="slide1/pat12.png"></div><div class="pat13"><img src="slide1/pat13.png"></div><div class="button4" onclick="playMet()"></div><div class="met1"><img src="slide1/met1.png"></div><div class="met2"><img src="slide1/met2.png"></div><div class="met3"><img src="slide1/met3.png"></div><div class="button5" onclick="playVid4()"></div>',
        );
      });
    </script>
  </body>
</html>
